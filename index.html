<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101114" />
  <title>Joke Break</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --card: #191b20;
      --text: #f5f5f2;
      --muted: #a4a6ad;
      --accent: #c6ff4a;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(198, 255, 74, 0.1), transparent 38rem),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: var(--accent);
      color: #14160f;
      font-size: 32px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 48px);
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 12px 0 30px;
      color: var(--muted);
      line-height: 1.6;
    }

    .joke-box {
      min-height: 150px;
      display: grid;
      align-content: center;
      gap: 12px;
      margin-bottom: 26px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
    }

    .joke-text {
      margin: 0;
      font-size: clamp(18px, 4vw, 23px);
      line-height: 1.55;
      white-space: pre-line;
    }

    .status {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      color: #14160f;
      background: var(--accent);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .button:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .credit {
      margin: 20px 0 0;
      color: #777a82;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">☻</div>
    <p class="eyebrow">A little laugh goes a long way</p>
    <h1>Joke Break</h1>
    <p class="intro">Need a laugh? Grab a fresh joke.</p>

    <section class="joke-box" aria-live="polite" aria-atomic="true">
      <p class="joke-text" id="joke">Your next joke is just a click away.</p>
    </section>

    <p class="status" id="status" role="status"></p>

    <button class="button" id="jokeButton" type="button">
      <span aria-hidden="true">↻</span>
      Tell me a joke
    </button>

    <p class="credit">Jokes provided by JokeAPI</p>
  </main>

  <script>
    const jokeElement = document.querySelector("#joke");
    const statusElement = document.querySelector("#status");
    const button = document.querySelector("#jokeButton");

    async function getJoke() {
      button.disabled = true;
      jokeElement.textContent = "Finding a good one…";
      statusElement.textContent = "";

      try {
        const response = await fetch(
          "https://v2.jokeapi.dev/joke/Any?safe-mode&type=single,twopart"
        );

        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error("The joke service returned an error.");
        }

        jokeElement.textContent = data.type === "twopart"
          ? `${data.setup}\n\n${data.delivery}`
          : data.joke;
      } catch (error) {
        jokeElement.textContent = "Looks like the joke got lost on the way.";
        statusElement.textContent = "Please check your connection and try again.";
        console.error("Could not fetch a joke:", error);
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", getJoke);
  </script>
</body>
</html>
